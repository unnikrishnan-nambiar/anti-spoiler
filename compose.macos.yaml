# Use the validated Linux x86-64 dependency set on Intel and Apple Silicon Macs.
# Apple Silicon runs these containers through Docker Desktop's x86 emulation.
services:
  db:
    platform: linux/amd64
  redis:
    platform: linux/amd64
  objectstore:
    platform: linux/amd64
  init:
    platform: linux/amd64
  api:
    platform: linux/amd64
  worker:
    platform: linux/amd64
  beat:
    platform: linux/amd64
  frontend:
    platform: linux/amd64
  laya:
    platform: linux/amd64
